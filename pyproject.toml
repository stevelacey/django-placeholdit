[project]
name = "django-placeholdit"
version = "1.1.0"
description = "A fully featured drop-in replacement of placehold.it for Django"
authors = [{ name = "Steve Lacey", email = "steve@steve.ly" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["django", "placeholder", "placeholder.com", "placehold.it"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
dependencies = ["django>=5.2", "wand>=0.7"]

[project.urls]
Homepage = "https://github.com/stevelacey/django-placeholdit"
Repository = "https://github.com/stevelacey/django-placeholdit"
Issues = "https://github.com/stevelacey/django-placeholdit/issues"

[tool.poetry]
packages = [{ include = "django_placeholdit" }]

[tool.poetry.group.lint.dependencies]
ruff = "*"

[tool.poetry.group.test.dependencies]
pytest = "^9.0"
pytest-django = "^4.9"
pytest-cov = "^5.0"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = [
    "--cov=django_placeholdit",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--strict-markers",
]
python_files = ["tests.py", "*_tests.py"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["django_placeholdit"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "S", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105"]

[tool.ruff.lint.isort]
known-first-party = ["django_placeholdit"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
